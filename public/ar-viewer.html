<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Viewer</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    .info { position: fixed; top: 10px; left: 10px; z-index: 999; color: white; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; font-family: sans-serif; }
    .back { position: fixed; top: 10px; right: 10px; z-index: 999; background: rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-family: sans-serif; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">
  <div class="info" id="status">Loading markers...</div>
  <a href="/" class="back">← Dashboard</a>
  <div id="scene"></div>
  
  <script>
    async function loadMarkers() {
      try {
        const res = await fetch('https://zywgdjbuttwyingoldgb.supabase.co/rest/v1/ar_markers', {
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5d2dkamJ1dHR3eWluZ29sZGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMjk2NzIsImV4cCI6MjA5MzgwNTY3Mn0.OQhE8u8JdmDLi-eBcguq7B81rFfOXPJ43vRpG_7aMdw'
          }
        })
        const markers = await res.json()
        
        document.getElementById('status').textContent = `${markers.length} markers ready`
        
        if (markers.length === 0) {
          document.getElementById('status').textContent = 'No markers configured'
          return
        }
        
        const sceneHTML = `
          <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
            ${markers.map(m => `
              <a-marker type="barcode" value="${m.barcode_id}">
                <a-box position="0 ${m.position_y || 0.5} 0" color="red" scale="${m.scale} ${m.scale} ${m.scale}"></a-box>
              </a-marker>
            `).join('')}
            <a-entity camera></a-entity>
          </a-scene>
        `
        
        document.getElementById('scene').innerHTML = sceneHTML
      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + e.message
      }
    }
    
    loadMarkers()
  </script>
</body>
</html>
