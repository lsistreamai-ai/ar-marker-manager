<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Barcode Markers</title>
  <style>
    body { margin: 0; padding: 20px; background: #111; font-family: sans-serif; color: white; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 600px; margin: 0 auto; }
    .marker { background: white; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; }
    canvas { width: 100%; height: auto; display: block; }
    .id { font-weight: bold; margin-top: 5px; font-size: 14px; color: #333; }
    h1 { text-align: center; font-size: 24px; }
    p { text-align: center; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>
  <h1>AR Barcode Markers</h1>
  <p>Click to download. Print and use with AR viewer.</p>
  <div class="grid" id="grid"></div>
  
  <script>
    function generateMarker(id) {
      const canvas = document.createElement('canvas')
      canvas.width = 200
      canvas.height = 200
      const ctx = canvas.getContext('2d')
      
      // White background
      ctx.fillStyle = 'white'
      ctx.fillRect(0, 0, 200, 200)
      
      // Black border (15%)
      ctx.fillStyle = 'black'
      ctx.fillRect(30, 30, 140, 140)
      
      // White inner (for 3x3 data area)
      ctx.fillStyle = 'white'
      ctx.fillRect(40, 40, 120, 120)
      
      // Black data area
      ctx.fillStyle = 'black'
      const cell = 40
      
      // Convert ID to 9-bit pattern (3x3)
      for (let i = 0; i < 9; i++) {
        const bit = (id >> i) & 1
        const row = Math.floor(i / 3)
        const col = i % 3
        if (bit) {
          ctx.fillRect(40 + col * cell, 40 + row * cell, cell, cell)
        }
      }
      
      return canvas
    }
    
    const grid = document.getElementById('grid')
    for (let i = 0; i < 64; i++) {
      const div = document.createElement('div')
      div.className = 'marker'
      div.onclick = () => {
        const canvas = generateMarker(i)
        const link = document.createElement('a')
        link.download = `barcode-${i}.png`
        link.href = canvas.toDataURL('image/png')
        link.click()
      }
      
      const canvas = generateMarker(i)
      div.appendChild(canvas)
      
      const idDiv = document.createElement('div')
      idDiv.className = 'id'
      idDiv.textContent = `#${i}`
      div.appendChild(idDiv)
      
      grid.appendChild(div)
    }
  </script>
</body>
</html>
