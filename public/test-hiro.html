<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Test AR - Hiro Marker</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; }
    .info { position: fixed; top: 10px; left: 10px; z-index: 999; color: white; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; font-family: sans-serif; font-size: 14px; max-width: 250px; }
    .back { position: fixed; top: 10px; right: 10px; z-index: 999; background: white; color: black; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-family: sans-serif; font-weight: bold; }
    a { color: #4da6ff; }
  </style>
</head>
<body>
  <div class="info">
    <strong>Test Mode: Hiro Marker</strong><br><br>
    1. Print this <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">Hiro marker</a><br>
    2. Point camera at it<br>
    3. You should see a RED BOX<br><br>
    If you see the box, AR works! ✅
  </div>
  <a href="/" class="back">← Back</a>

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-box position="0 0.5 0" color="red" depth="1" height="1" width="1"></a-box>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
